name: Module07 documental validation
on:
  pull_request:
    paths:
      - "web/lib/tribunales/**"
      - "web/components/tribunales/**"
      - "web/app/tribunales-alta-integridad/**"
      - "web/app/api/tribunales/**"
      - "web/supabase/migrations/*module07*"
      - "web/scripts/*module07*"
      - "web/scripts/register-test-types.mjs"
      - "web/package*.json"
      - "web/tsconfig.json"
      - ".github/workflows/module07-documental.yml"
permissions:
  contents: read
jobs:
  documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:documental
      - run: npm run typecheck
      - run: npx --no-install eslint components/tribunales lib/tribunales app/api/tribunales app/tribunales-alta-integridad scripts/register-test-types.mjs scripts/test-module07-*.mjs
      - name: PostgreSQL local, no remote credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/module07-pglite" --no-package-lock --ignore-scripts --no-audit @electric-sql/pglite@0.3.14
          node scripts/test-module07-sql.mjs "$RUNNER_TEMP/module07-pglite/node_modules/@electric-sql/pglite/dist/index.js"
      - name: HTTP local, privileged operations must remain closed
        run: |
          node node_modules/next/dist/bin/next dev --port 3007 > "$RUNNER_TEMP/module07-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:3007/api/tribunales/operations/publication; then break; fi
            sleep 1
          done
          node scripts/test-module07-http.mjs http://127.0.0.1:3007
